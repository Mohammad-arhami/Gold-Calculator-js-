<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ماشین حساب طلا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header class="page-header">
      <h1>💰 ماشین حساب طلا</h1>
      <p class="subtitle">قیمت نهایی خرید طلا را دقیق محاسبه کن</p>
    </header>

    <main class="grid">
      <!-- ستون فرم -->
      <section class="card form-card">
        <h2 class="card-title">اطلاعات ورودی</h2>

        <div class="field">
          <label>نرخ روز طلا (هر گرم - تومان)</label>
          <input type="text" inputmode="numeric" id="goldPrice" placeholder="24,000,000" />
        </div>

        <div class="field">
          <label>وزن طلا (گرم)</label>
          <input type="text" inputmode="decimal" id="weight" placeholder="1.5" />
        </div>

        <div class="field">
          <label>اجرت ساخت (%)</label>
          <input type="text" inputmode="decimal" id="wagePercent" placeholder="5" />
        </div>

        <div class="field">
          <label>سود فروشنده (%)</label>
          <input type="text" inputmode="decimal" id="profitPercent" value="7" />
        </div>

        <div class="field">
          <label>مالیات بر ارزش افزوده (%)</label>
          <input type="text" inputmode="decimal" id="taxPercent" value="9" />
        </div>

        <div class="buttons">
          <button id="calcBtn" class="btn-primary">محاسبه</button>
          <button id="resetBtn" class="btn-secondary">پاک کردن</button>
        </div>
      </section>

      <!-- ستون نتیجه -->
      <aside class="card result-card">
        <h2 class="card-title">نتیجه محاسبه</h2>

        <div class="result" id="result" hidden>
          <div class="row"><span>قیمت طلا:</span><strong id="rGold">—</strong></div>
          <div class="row"><span>اجرت ساخت:</span><strong id="rWage">—</strong></div>
          <div class="row"><span>سود فروشنده:</span><strong id="rProfit">—</strong></div>
          <div class="row"><span>مالیات:</span><strong id="rTax">—</strong></div>
          <div class="row total"><span>مبلغ نهایی:</span><strong id="rTotal">—</strong></div>
        </div>

        <div class="placeholder" id="placeholder">
          <div class="placeholder-icon">🧾</div>
          <p>اطلاعات را وارد کن و روی «محاسبه» بزن</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
